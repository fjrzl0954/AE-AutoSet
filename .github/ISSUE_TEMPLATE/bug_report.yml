name: Bug report
description: Something went wrong while setting up cuts.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This page is public. Do not attach production work:** no timesheet scans, cel or LO images, or AEP files from real works.
        If a picture helps, use the DEMO work or a redrawn example.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: after-effects
    attributes:
      label: After Effects version
      placeholder: After Effects 2025 (25.x)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent
      options:
        - Codex
        - Claude Code
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and reasoning
      placeholder: GPT-6.2-Sol, xhigh
  - type: dropdown
    id: language
    attributes:
      label: Window language
      options:
        - English
        - Korean
        - Japanese
        - Simplified Chinese
  - type: textarea
    id: notes
    attributes:
      label: Note files and error messages
      description: |
        Paste the text of the note files in the cut folder (Needs review, Mapping failed, Analysis failed, Apply failed, in any language) and any error the window showed. Remove names or paths you'd rather keep private.
      render: text
  - type: input
    id: version
    attributes:
      label: AE AutoSet version
      description: The commit you cloned, or the date you downloaded it.
  - type: checkboxes
    id: confidential
    attributes:
      label: Confidentiality
      options:
        - label: I did not attach production work (timesheets, cels, LO, AEP).
          required: true
