name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This page is public. Please don't attach production work.
  - type: textarea
    id: want
    attributes:
      label: What would you like?
      description: What should AE AutoSet do, and in which situation?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you do it now?
      description: Your current workaround, if any.
